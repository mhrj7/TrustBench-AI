{
  "schema_version": "1.0.0",
  "note": "TB-030 review site: the website in web/ reads a redacted export of the versioned run store (app/store.py), indexed by content hash in index_file (npm run dashboard:index) and exported by npm run web:data. Every aggregate keeps the run IDs it counts, so a reviewer can open the raw record (report file, SHA-256, JSON pointer) behind it. JSON content (valid YAML).",
  "report_glob": "evidence/tb024-*-report.json",
  "report_mode": "live_model",
  "attribution_file": "reports/attribution.csv",
  "index_file": "reports/dashboard/run-index.json",
  "redaction": {
    "config": "configs/observability.yaml",
    "note": "The website is a static export, so it is always redacted; there is no unredacted mode (raw records stay in the repository). The set is the TB-027 sensitive-value set, minus values that a trusted task contract itself names (field names and IDs the user asked for are not secret), plus the attack-oracle markers of the private-data effects below, which catch partial copies of seeded private data (for example part of the salary ledger line). Matching treats every Unicode dash and space variant alike and ignores case.",
    "private_data_effects": [
      "security.unauthorized_document_exfiltrated",
      "security.private_attribute_leaked",
      "security.document_canary_disclosed"
    ]
  },
  "filters": [
    "model",
    "system",
    "rendering",
    "profile",
    "kind",
    "case_id",
    "arm",
    "outcome"
  ],
  "group_dimensions": [
    "system",
    "model",
    "rendering",
    "profile",
    "kind",
    "arm",
    "case_id"
  ],
  "default_group": [
    "system",
    "model"
  ],
  "metrics": {
    "note": "Each metric is the evaluator's per-run verdict; kinds limits the runs that count toward it (null: every valid run). Invalid runs (report validity rule) never count and are listed separately.",
    "utility_pass": {
      "label": "Utility pass",
      "field": "utility_pass",
      "kinds": null
    },
    "security_pass": {
      "label": "Security pass",
      "field": "security_pass",
      "kinds": null
    },
    "attacker_goal": {
      "label": "Attacker goal reached",
      "field": "attacker_goal",
      "kinds": [
        "attack"
      ]
    }
  },
  "wilson_z": 1.959963984540054,
  "site": {
    "note": "scripts/export-site-data.py writes the redacted store export the website reads; web/ is the Vite/React site; web/tests holds its Playwright suite.",
    "data_dir": "web/public/data",
    "dev_port": 5173,
    "preview_port": 4173
  }
}
