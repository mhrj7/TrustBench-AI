    "resource_outside_contract"
  ],
  "suppressed_duplicate": {
    "note": "The runtime answers an exact duplicate write from its ledger without running it and records attempts 0 (src/agent/recovery.ts, callTool). Such a step changed no state.",
    "attempts": 0
  },
  "defense_denial_codes": {
    "note": "Error codes with which a defense refuses a call: the gateway and capability checks (literals in the listed sources; tests/analysis checks they are still there), every denied_error_code of a registered defense, and flow-check reasons by prefix. Schema errors (invalid_arguments) and service errors are not defense denials.",
    "gateway_codes": [
