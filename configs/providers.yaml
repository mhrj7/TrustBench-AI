{
  "schema_version": "1.0.0",
  "note": "Runtime model providers for the OpenAI-compatible chat adapter. Keys are read from the environment variable named here (never from prompts or committed files). OpenAI is intentionally absent: no paid credits. model_rate_limits are free-tier limits observed from provider errors; the harness paces requests so that the input tokens sent in any 60-second window stay under them (estimate: characters / token_estimate_chars_per_token, conservative).",
  "providers": {
    "ollama": {
      "base_url": "http://127.0.0.1:11434/v1",
      "loopback_only": true,
      "api_key_env": null,
      "reduced_schemas": false,
      "omit_settings": [],
      "send_reasoning_effort": true,
      "budget_file": "configs/budget-local.yaml",
      "generation_overrides": {
        "reasoning_effort": "none"
      },
      "revision_lookup": {
        "url": "http://127.0.0.1:11434/api/tags",
        "list_field": "models",
        "name_field": "name",
        "digest_field": "digest"
      }
    },
    "gemini": {
      "provider_label": "google",
      "base_url": "https://generativelanguage.googleapis.com/v1beta/openai",
      "loopback_only": false,
      "api_key_env": "GEMINI_API_KEY",
      "reduced_schemas": true,
      "omit_settings": [
        "seed"
      ],
      "send_reasoning_effort": false,
      "budget_file": "configs/budget-gemini-free.yaml",
      "generation_overrides": {},
      "model_rate_limits": {
        "gemma-4-26b-a4b-it": {
          "input_tokens_per_minute": 16000,
          "source": "Gemini API 429 message on 2026-10-16: metric generate_content_free_tier_input_token_count, limit 16000, model gemma-4-26b"
        }
      }
    },
    "nvidia": {
      "base_url": "https://integrate.api.nvidia.com/v1",
      "loopback_only": false,
      "api_key_env": "NVIDIA_API_KEY",
      "reduced_schemas": false,
      "omit_settings": [],
      "send_reasoning_effort": false,
      "budget_file": "configs/budget-nvidia-free.yaml",
      "generation_overrides": {}
    }
  },
  "quota_exhausted_message_pattern": "retry in \\d+h|retry in \\d+m",
  "token_estimate_chars_per_token": 3
}
