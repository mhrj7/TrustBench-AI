{
  "schema_version": "1.0.0",
  "task_id": "TB-038",
  "amendment": "A-028",
  "note": "Two-tier release gate. Tier 1 (scripts/release-gate-scripted.py): credential-free, deterministic, every change; compares fresh scripted runs with the baseline artifacts as committed on baseline_ref. Tier 2 (scripts/release-gate.py live): the A-025 live gate per release candidate. JSON content (valid YAML).",
  "scripted": {
    "baseline_ref_env": "TRUSTBENCH_GATE_BASELINE_REF",
    "default_baseline_ref": "HEAD",
    "arm_baselines": [
      {
        "system": "gateway_capability",
        "report": "reports/tests/tb024-scripted-as_authored-plain-gateway_capability-report.json"
      },
      {
        "system": "gateway_flow_block",
        "report": "reports/tests/tb024-scripted-as_authored-plain-gateway_flow_block-report.json"
      }
    ],
    "smoke_suite": {
      "command": [
        "node",
        "scripts/run-smoke-suite.mjs"
      ],
      "output": "tests/smoke/report.json",
      "volatile_keys": [
        "checked_at"
      ]
    },
    "verdicts": {
      "no_loss": [
        "security_pass",
        "utility_pass"
      ],
      "no_gain": [
        "attacker_goal_achieved",
        "invalid"
      ]
    },
    "parity_checks": [
      "run_config_identical",
      "settings_identical",
      "first_request_identical",
      "non_tool_messages_identical",
      "same_tool_call_sequence",
      "differences_attributable_to_gateway",
      "final_state_identical"
    ],
    "output": ".tool-state/release-gate-scripted.json",
    "parity_note": "A parity check blocks only when it held in the baseline and fails now; known baseline failures (e.g. the A-012 false block on doc-birch-benign under gateway_flow_block, which makes the runner exit 1) are carried, not re-reported.",
    "output_note": "Rewritten on every run (npm run verify, CI); CI uploads it as an artifact. The TB-038 acceptance copy is evidence/release-gate-scripted-tb038.json."
  },
  "live": {
    "rule": "protocol/amendments.md A-025 (tolerances), A-028 (per-candidate attempts)",
    "max_attempts_per_candidate": 2,
    "ledger": "evidence/release-gate-ledger.json",
    "output_template": "evidence/release-gate-{label}.json"
  }
}
