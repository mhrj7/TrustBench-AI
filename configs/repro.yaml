{
  "note": "TB-046 reproducibility package (scripts/repro.py builds repro/ from this file). JSON content (valid YAML).",
  "release_tag_prefix": "repro-tb046",
  "inventory": {
    "fixtures": ["data/benign.jsonl", "data/attacks.jsonl", "data/attack-oracles.json", "data/attack-renderings.json", "data/attack-materialization.json", "data/splits.json"],
    "seeds_from": "protocol/experiment-registry.yaml",
    "seed_keys": ["pair_order_seed", "holdout.split_seed", "uncertainty.bootstrap_resamples"],
    "configs": ["configs/*.yaml", "configs/*.json", "configs/cli/*.yaml", "configs/deploy/*.json", "protocol/experiment-registry.yaml", "protocol/amendments.md", "manifests/pinned.json", "data/manifest.json"],
    "analysis_scripts": ["scripts/compute-security-utility.py", "scripts/estimate-uncertainty.py", "scripts/measure-cost-latency.py", "scripts/analyse-ablations.py",
                         "scripts/build-related-work.py", "research/related-work-rows.py", "scripts/test-hypothesis.py", "scripts/label-audit.py", "src/evaluators/outcomes_v2.py", "src/cli.py"],
    "raw_records": ["evidence/tb032-holdout-run.json", "evidence/tb032-holdout2-run.json", "runs/holdout/**/report.json", "runs/holdout2/**/report.json",
                    "research/label-audit/review-a.jsonl", "research/label-audit/review-b.jsonl", "research/label-audit/adjudication.jsonl"]
  },
  "exclusions": [
    {"path": ".env", "reason": "API keys (only .env.example, with empty values, is published)"},
    {"path": "deploy/secrets", "reason": "deployment secrets mounted into the demo container"},
    {"path": "backups", "reason": "demo backups: visitor sessions, accounts and runs"},
    {"path": "data/vendor", "reason": "the AgentDojo checkout is not redistributed; fetch-data clones the pinned commit (MIT, notice kept in third_party/licenses)"},
    {"path": ".tool-state", "reason": "local scratch, logs and service state"},
    {"path": "work", "reason": "local review scratch"},
    {"path": ".venv-tools", "reason": "local environment, rebuilt from the hash-pinned locks"}
  ],
  "secret_patterns": ["nvapi-[A-Za-z0-9_-]{20,}", "AIza[0-9A-Za-z_-]{30,}", "sk-[A-Za-z0-9]{20,}", "gsk_[A-Za-z0-9]{20,}", "hf_[A-Za-z0-9]{20,}", "ghp_[A-Za-z0-9]{20,}",
                      "-----BEGIN [A-Z ]*PRIVATE KEY-----", "tskey-[A-Za-z0-9-]{20,}"],
  "secret_allowlist": {"tests/trace-contract.test.ts": "a fake key the trace redaction test must remove"},
  "personal_patterns": ["/Users/[A-Za-z]", "@gmail\\.com", "[Mm]ac[ -]?mini"],
  "offline_steps": [
    {"name": "fixtures, splits, sealed manifests, protocol, frozen configuration", "command": ["sh", "bin/trustbench", "validate"]},
    {"name": "pinned content hashes", "command": ["sh", "bin/trustbench", "manifest"]},
    {"name": "scripted smoke suite and arm comparison", "command": ["sh", "bin/trustbench", "smoke", "--check"]},
    {"name": "TB-033..TB-036 metrics, intervals, cost and ablations from the raw run records", "command": ["sh", "bin/trustbench", "report"]},
    {"name": "TB-043 related-work matrix", "command": [".venv-tools/bin/python", "scripts/build-related-work.py"]},
    {"name": "TB-044 hypothesis test", "command": [".venv-tools/bin/python", "scripts/test-hypothesis.py"]},
    {"name": "TB-045 full-population re-analysis (A-029)", "command": [".venv-tools/bin/python", "scripts/label-audit.py", "rerun"]},
    {"name": "TB-045 label audit report", "command": [".venv-tools/bin/python", "scripts/label-audit.py", "report"]},
    {"name": "reproduction tests of the published reports", "command": ["sh", "bin/trustbench", "report", "--check"]},
    {"name": "research tests", "command": [".venv-tools/bin/python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/research", "-k", "not last_recorded_reproduction"], "note": "the excluded test checks the previous reproduction's log, which a running reproduction has not written yet"}
  ],
  "volatile_json_keys": ["generated_at", "checked_at", "request_id", "span_id", "parent_span_id", "trace_id"],
  "volatile_json_key_patterns": ["_ms$", "_ms_total$", "(^|\\.)ms$"],
  "volatile_note": "Timestamps, wall-clock timings (keys ending in _ms) and random request, span and trace IDs. Everything else must be identical; SQLite files are compared by their SQL dump, not their bytes.",
  "volatile_line_patterns": ["^Generated by `scripts/label-audit.py report` on \\d{4}-\\d{2}-\\d{2}"],
  "reproduction_log": "repro/reproduction-log.json",
  "additional_reproduction_logs": ["repro/reproduction-log-clone.json"]
}
